name: Refresh postings

on:
  schedule:
    - cron: "11 11 * * *"   # once a day
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write          # to open a "data-alert" issue when a run fails or a source stops answering (everyone watching the repository gets an email)

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # the newest main, not the commit this run was queued at
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect postings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}        # optional, free key from jooble.org/api/about
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}  # optional, free key from careerjet.com/partners/api
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}            # optional, raises The Muse limit
        run: node scripts/collect.mjs
      - name: Count the numbers on the start page
        run: node scripts/cover-stats.mjs        # writes docs/stats.json from the postings just collected
      - name: Check every source
        id: health
        run: |
          git show HEAD:docs/jobs.json > "$RUNNER_TEMP/previous.json" 2>/dev/null || echo "{}" > "$RUNNER_TEMP/previous.json"
          node scripts/source-health.mjs "$RUNNER_TEMP/previous.json" docs/jobs.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish jobs.json
        run: |
          git config user.name "path-match-bot"
          git config user.email "path-match-bot@users.noreply.github.com"
          git add docs/jobs.json docs/stats.json docs/d docs/jobs reports/source_health.md reports/source_health.json   # docs/jobs: Job Bank open data, changes once a month; docs/stats.json: the four numbers of the start page; reports: the source health table
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh postings"
          # another run or a code change may have been pushed meanwhile: the data of this run wins in docs/jobs.json, docs/d and docs/jobs
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
      - name: Tell the team when a source stops answering
        if: steps.health.outputs.alert == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-alert --color B60205 --description "The daily refresh needs a person" 2>/dev/null || true
          n=$(gh issue list --label data-alert --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file reports/source_alert.md
          else gh issue create --title "Data alert: a source needs attention" --label data-alert --body-file reports/source_alert.md; fi
      - name: Tell the team when the refresh fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-alert --color B60205 --description "The daily refresh needs a person" 2>/dev/null || true
          body="The daily refresh failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The site keeps the previous postings until a run succeeds."
          n=$(gh issue list --label data-alert --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
          else gh issue create --title "Data alert: the daily refresh failed" --label data-alert --body "$body"; fi
