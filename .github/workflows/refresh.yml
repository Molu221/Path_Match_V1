name: Refresh postings

on:
  schedule:
    - cron: "11 11 * * *"   # once a day
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect postings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}        # optional, free key from jooble.org/api/about
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}  # optional, free key from careerjet.com/partners/api
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}            # optional, raises The Muse limit
        run: node scripts/collect.mjs
      - name: Publish jobs.json
        run: |
          git config user.name "path-match-bot"
          git config user.email "path-match-bot@users.noreply.github.com"
          git add docs/jobs.json docs/d
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh postings"
          git pull --rebase origin main
          git push
