name: Probe job sites

# Checks which job sites answer from GitHub's machines, and in what shape. Writes reports/probe.json.
on:
  workflow_dispatch:
    inputs:
      config:
        description: Probe list (a file in config/)
        default: config/probe.json
      out:
        description: Report file name (written to reports/)
        default: probe.json

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        env:
          PROBE_CONFIG: ${{ inputs.config || 'config/probe.json' }}
          PROBE_OUT: ${{ inputs.out || 'probe.json' }}
        run: node scripts/probe.mjs "$PROBE_CONFIG" "$PROBE_OUT"
      - name: Publish the result
        run: |
          git config user.name "path-match-bot"
          git config user.email "path-match-bot@users.noreply.github.com"
          git add reports/*.json
          [ -d reports/probe ] && git add reports/probe || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Probe job sites"
          git pull --rebase origin main
          git push
