name: Keyword report

on:
  workflow_dispatch: {}
  push:
    paths:
      - "posts/**"
      - "cv/**"
      - "python/**"
      - "scripts/run_reports.py"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run keyword extractor on every post
        run: python3 scripts/run_reports.py cv/sample_cv.txt
      - name: Save reports
        run: |
          git config user.name "path-match-bot"
          git config user.email "path-match-bot@users.noreply.github.com"
          git add reports docs/reports.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update keyword reports"
          git push
