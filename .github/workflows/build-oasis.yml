name: Build OaSIS dictionary

# Downloads the official OaSIS CSV files (English and French, all occupations) from
# open.canada.ca, builds python/oasis_data.json and python/oasis_vocab.csv, then
# re-runs the keyword reports. Run it from the Actions tab.
# Default release: OaSIS 2025 (the current one on https://noc.esdc.gc.ca/OaSIS/).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "OaSIS release"
        type: choice
        options: ["2025", "2022"]
        default: "2025"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python3 -m unittest test.test_oasis
      - name: Restore files downloaded in earlier runs
        uses: actions/cache/restore@v4
        with:
          path: data/oasis_raw
          key: oasis-raw-v2-none
          restore-keys: oasis-raw-v2-
      - name: Download OaSIS and build the dictionary
        timeout-minutes: 25
        run: |
          set -o pipefail
          python3 -u scripts/build_oasis_dictionary.py --version "${{ inputs.version || '2025' }}" 2>&1 | tee oasis_build_log.txt
      - name: Keep downloaded files for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/oasis_raw
          key: oasis-raw-v2-${{ github.run_id }}
      - name: Re-run keyword reports with OaSIS
        run: python3 scripts/run_reports.py cv/sample_cv.txt
      - name: Save results and log
        if: always()
        run: |
          git config user.name "path-match-bot"
          git config user.email "path-match-bot@users.noreply.github.com"
          for f in python/oasis_data.json python/oasis_vocab.csv oasis_build_log.txt reports docs/reports.json; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Build OaSIS dictionary (log)"
          git pull --rebase origin main
          git push
