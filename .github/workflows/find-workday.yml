name: Find Workday sites

# Tries likely Workday career-site addresses for the employers in config/candidates.json and writes reports/workday.json.
# Add the sites it finds to "workday" in config/companies.json.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Try the likely Workday addresses for every candidate
        run: node scripts/find-workday.mjs
      - name: Save the report
        run: |
          git config user.name "path-match-bot"
          git config user.email "path-match-bot@users.noreply.github.com"
          git add reports/workday.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Find Workday sites"
          git pull --rebase origin main
          git push
