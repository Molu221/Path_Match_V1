name: Find Workday sites

# Checks the tenants in config/workday_candidates.json (and the sites already known there) and writes reports/workday.json.
# The sites it finds are added to "workday" in config/companies.json by scripts/apply-finds.mjs (names from config/workday_names.json when it has one).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Try every tenant against the usual hosts and site names
        run: node scripts/find-workday.mjs
      - name: Add the sites it found to the config
        run: node scripts/apply-finds.mjs --workday reports/workday.json
      - name: Save the report and the config
        run: |
          git config user.name "path-match-bot"
          git config user.email "path-match-bot@users.noreply.github.com"
          git add reports/workday.json reports/applied.json config/companies.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Find Workday sites"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
